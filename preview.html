px solid #e5e8ec;border-radius:20px;padding:6px 12px;color:#626d79}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:32px}.stat{background:white;border:1px solid #e5e8ec;border-radius:12px;padding:19px;text-align:left;display:flex;align-items:center;gap:15px}.stat strong{font-size:25px;display:block;margin-top:5px}.status-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#fff1e5;color:#d68b38;font-size:18px}.stat:nth-child(2) .status-icon{background:#e8f5ed;color:#4a996c}.stat:nth-child(3) .status-icon{background:#eef0ff;color:#8188cc}.section-head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 14px}.section-head h2{font-size:18px;margin:0}.section-head span{color:#969da6;font-weight:400;margin-left:8px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e5e8ec;border-radius:12px;overflow:hidden}.thumb{aspect-ratio:16/9;background:#e7e9ef;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;bottom:10px;left:10px;background:#1a2230ce;color:white;font-size:11px;padding:5px 8px;border-radius:5px}.body{padding:15px}.title{color:#29313d;text-decoration:none;font-weight:650;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;font-size:14px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:13px;color:#a2a8b0;font-size:11px}select{border:1px solid #e5e8ed;border-radius:6px;background:white;padding:5px;font-size:11px;color:#727b87}.list{background:white;border:1px solid #e5e8ec;border-radius:12px;overflow:hidden}.list .card{border:0;border-bottom:1px solid #edf0f3;border-radius:0;display:flex;padding:18px;gap:20px}.list .thumb{width:190px;flex-shrink:0;border-radius:8px}.list .body{padding:0;flex:1}.list .title{min-height:0}.match{color:#b16a45;background:#fff1e5;padding:10px 14px;border-radius:8px;margin-bottom:18px;font-size:12px}.empty{text-align:center;padding:60px;color:#838c97}.clear{color:#cd6452}.footer{color:#a1a8b0;font-size:12px;margin:35px 0}.stat.selected{border-color:#e78d7b;background:#fffaf8}@media(max-width:950px){aside{width:170px;padding:25px 15px}main{margin-left:170px;padding:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){aside{display:none}main{margin:0;padding:20px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px;gap:8px}.status-icon{display:none}.list .thumb{width:110px}.list .card{gap:12px;padding:12px}}
</style><aside><div class="brand"><span class="logo">▶</span>모아</div><div class="sub">저장한 영상을, 다시 발견하다</div><button class="nav active" id="home">▦ &nbsp; 내 보관함</button><div class="small-label">바로 찾기</div><button class="nav quick" data-q="Ableton Live">♫ &nbsp; Ableton Live</button><button class="nav quick" data-q="Claude Code">⌘ &nbsp; Claude Code</button><button class="nav quick" data-q="피아노">♬ &nbsp; 피아노</button><div class="aside-note">화면 미리보기 · 실제 표본 10개<br>시청 상태는 예시입니다.</div></aside><main><div class="top"><span>내 라이브러리 / 유튜브</span><span class="pill">디자인 미리보기</span></div><h1>저장해 둔 영상, 꺼내볼 시간.</h1><div class="intro">이어 보던 영상부터 궁금했던 주제까지, 내 방식대로 모아두세요.</div><div class="search"><span class="search-icon">⌕</span><input id="search" aria-label="태그 검색" placeholder="태그로 찾아보세요. 피아노, piano, 에이블톤…"><button id="clear" aria-label="검색 지우기">✕</button><span class="key">/</span></div><div class="suggest"><span>이런 태그로 찾아보세요</span><button data-q="piano">piano ↔ 피아노</button><button data-q="Ableton Live">Ableton Live</button><button data-q="업무자동화">업무자동화</button><button data-q="Claude Code">Claude Code</button></div><div id="content"></div><div class="footer">실제 북마크 10개로 구성한 시안입니다. 전체 북마크 태깅과 시청 기록 연동은 아직 실행하지 않았습니다.</div></main><script>
const videos=[{"id": "bJwF79UI-Ao", "title": "Making a Full Lofi House Track in Under 1 Hour! | Ableton Live Tutorial - YouTube", "url": "https://www.youtube.com/watch?v=bJwF79UI-Ao", "tags": ["Ableton Live", "Lofi House", "작곡", "음악프로듀싱"], "status": "시청중"}, {"id": "dwb9Rfp6two", "title": "제미나이 붙은 구글시트 100배 활용법도 알려드립니다 (오힘찬 테크 칼럼니스트) - YouTube", "url": "https://www.youtube.com/watch?v=dwb9Rfp6two", "tags": ["구글시트", "Gemini", "NotebookLM", "업무자동화", "노코드"], "status": "두고볼 것"}, {"id": "NhlvUP_Ozsc", "title": "How to actually play songs on piano - YouTube", "url": "https://www.youtube.com/watch?v=NhlvUP_Ozsc", "tags": ["피아노", "편곡", "음악이론", "연주법"], "status": "시청중"}, {"id": "FeajKnXLkt0", "title": "윈도우즈에서 MCP 사용하기 | 클로드 - YouTube↗", "url": "https://www.youtube.com/watch?v=FeajKnXLkt0&t=87s", "tags": ["Claude", "MCP", "Windows", "LLM"], "status": "시청완료"}, {"id": "ZCK-zL3c2vA", "title": "똑같은 프롬프트인데 비용이 1/3? Claude Code에 제2의 뇌 만들기 (Graphify + Obsidian) - YouTube", "url": "https://www.youtube.com/watch?v=ZCK-zL3c2vA", "tags": ["Claude Code", "Graphify", "Obsidian", "개발도구", "토큰비용절감"], "status": "두고볼 것"}, {"id": "8AlpJzWLw-w", "title": "(1) 미니맥스 M2.1 vs 클로드 vs 챗GPT 실전 비교 | API 비용 10분의 1로 업무 자동화하는 방법 - YouTube", "url": "https://www.youtube.com/watch?v=8AlpJzWLw-w", "tags": ["MiniMax", "Claude", "ChatGPT", "업무자동화", "LLM비교"], "status": "두고볼 것"}, {"id": "nuGUBIgMeE8", "title": "(놓치면 안되는 Claude code 최신기능) Agent teams 10분안에 시작부터 활용까지(실무 프롬프트 꿀팁 포함) - YouTube", "url": "https://www.youtube.com/watch?v=nuGUBIgMeE8", "tags": ["Claude Code", "AI에이전트", "오케스트레이션", "개발도구"], "status": "시청완료"}, {"id": "dt9SFEFe8ho", "title": "Learn Ableton Live 12 in 2026 - FULL COURSE - YouTube", "url": "https://www.youtube.com/watch?v=dt9SFEFe8ho", "tags": ["Ableton Live", "작곡", "음악프로듀싱", "사운드디자인"], "status": "시청중"}, {"id": "_gqWjMt5uGU", "title": "(24) 서울에서 30끼 먹고 너무 좋다 - YouTube", "url": "https://www.youtube.com/watch?v=_gqWjMt5uGU", "tags": ["서울맛집", "먹방", "여행브이로그", "맛집탐방"], "status": "두고볼 것"}, {"id": "pkxWxpYu2u4", "title": "Joe Dart’s Bass Solo in Exotic (Transcription + Tabs) #joedart #thefearlessflyers #basstabs - YouTube", "url": "https://www.youtube.com/shorts/pkxWxpYu2u4", "tags": ["베이스기타", "Joe Dart", "The Fearless Flyers", "타브악보", "채보"], "status": "시청완료"}];const statuses=['시청중','시청완료','두고볼 것']; const icons=['▷','✓','◇'];let filter='';const aliases={'피아노':['piano'],'베이스기타':['bass','bass guitar','베이스'],'Ableton Live':['ableton','에이블톤','에이블톤 라이브'],'음악이론':['music theory','음악 이론'],'Claude Code':['클로드 코드','claude code'],'Claude':['클로드'],'작곡':['composition'],'업무자동화':['automation','업무 자동화'],'편곡':['arrangement'],'Gemini':['제미나이']};const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>s.toLowerCase().replace(/\s+/g,'');
function card(v){return `<article class="card"><a class="thumb" href="${escape(v.url)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy"><span class="badge">${v.status}</span></a><div class="body"><a class="title" href="${escape(v.url)}" target="_blank" rel="noopener">${escape(v.title.replace(/ - YouTube.*$/,''))}</a><div>${v.tags.map(t=>`<button class="chip" data-q="${escape(t)}">${escape(t)}</button>`).join('')}</div><div class="meta"><span>내 북마크</span><select aria-label="${escape(v.title)} 시청 상태" data-id="${v.id}">${statuses.map(s=>`<option ${s===v.status?'selected':''}>${s}</option>`).join('')}</select></div></div></article>`}
function render(){const q=document.querySelector('#search').value.trim();let html='';if(q){const matches=videos.filter(v=>v.tags.some(t=>[t,...(aliases[t]||[])].some(a=>norm(a).includes(norm(q)))));const expanded=Object.entries(aliases).filter(([t,aa])=>aa.some(a=>norm(a)===norm(q))).map(([t])=>t);html=`<div class="section-head"><h2>‘${escape(q)}’ 검색 결과 <span>${matches.length}개 영상</span></h2><button class="clear" id="reset">전체 보관함 보기 ↗</button></div>${expanded.length?`<div class="match">‘${escape(q)}’와 같은 뜻의 태그 <b>${expanded.map(escape).join(', ')}</b>도 함께 찾았어요.</div>`:''}<div class="list">${matches.map(card).join('')||'<div class="empty">일치하는 태그가 없습니다. 다른 태그로 검색해 보세요.</div>'}</div>`}else{html=`<div class="stats">${statuses.map((s,i)=>`<button class="stat ${filter===s?'selected':''}" data-status="${s}"><span class="status-icon">${icons[i]}</span><div>${s}<strong>${videos.filter(v=>v.status===s).length}</strong></div></button>`).join('')}</div>`;for(const s of statuses.filter(s=>!filter||s===filter)){const vv=videos.filter(v=>v.status===s);html+=`<div class="section-head"><h2>${s}<span>${vv.length}</span></h2>${filter?'<button id="reset" class="clear">모두 보기</button>':''}</div><div class="grid">${vv.map(card).join('')||'<p class="empty">아직 영상이 없습니다.</p>'}</div>`}}document.querySelector('#content').innerHTML=html;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b){document.querySelector('#search').value=b.dataset.q;render();}const s=e.target.closest('[data-status]');if(s){filter=filter===s.dataset.status?'':s.dataset.status;render();}if(e.target.closest('#home,#reset,#clear')){document.querySelector('#search').value='';filter='';render();}});document.addEventListener('change',e=>{if(e.target.matches('select[data-id]')){videos.find(v=>v.id===e.target.dataset.id).status=e.target.value;render();}});document.querySelector('#search').addEventListener('input',render);document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.querySelector('#search').focus();}if(e.key==='Escape'){document.querySelector('#search').value='';filter='';render();}});render();
</script></html>
