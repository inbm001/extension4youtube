<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커리큘럼 편집 시안</title><style>
*{box-sizing:border-box}body{margin:0;color:#ddd;background:#161616;font:14px/1.6 system-ui}header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid #383838;position:sticky;top:0;background:#161616;z-index:2}h1{font-size:18px;margin:0}a{color:#a8caff}button,input,textarea,select{font:inherit;color:inherit}button{background:#292929;border:1px solid #505050;border-radius:5px;padding:5px 10px;cursor:pointer}button:disabled{opacity:.3;cursor:default}button:hover:enabled{background:#3a3a3a}input,textarea,select{background:#202020;border:1px solid #484848;border-radius:5px;padding:7px 10px;max-width:100%}input,textarea{width:100%}textarea{min-height:58px;resize:vertical}label{display:block;font-size:12px;color:#aaa;margin:8px 0}label input,label textarea{display:block;margin-top:4px;color:#eee}main{max-width:1400px;margin:auto;padding:16px 22px}.intro{font-size:12px;color:#aaa;margin:0 0 14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:24px;border-top:1px solid #383838;margin-top:15px;padding-top:15px}h2{font-size:15px;margin:0 0 10px}.section{border:1px solid #414141;border-radius:6px;margin-bottom:14px;padding:12px}.section.active{border-color:#88aac7}.row{display:flex;gap:8px;align-items:center}.row input{flex:1;min-width:0}.spacer{flex:1}small,#status{font-size:12px;color:#aaa}.lesson{display:flex;gap:7px;align-items:center;border-bottom:1px solid #333;padding:8px 0}.lesson .name{flex:1;min-width:0}.lesson button{padding:2px 7px}.empty{font-size:12px;color:#888;padding:12px 0}.library{position:sticky;top:82px;align-self:start}.library-list{max-height:62vh;overflow:auto}.video{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #383838}.video .name{flex:1}.tag{font-size:11px;color:#999}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hint{color:#cbb680;font-size:12px}dialog{color:#ddd;background:#202020;border:1px solid #777;border-radius:8px;max-width:760px;width:90%;max-height:85vh;overflow:auto}dialog::backdrop{background:#0009}.preview-section{border-top:1px solid #444;margin-top:16px;padding-top:8px}.preview-section h3{font-size:15px}.preview-section ol{padding-left:24px}.saved{color:#a9c4ad}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #9ac8f0;outline-offset:2px}@media(max-width:760px){.cols,.meta{grid-template-columns:1fr}.library{position:static}header{flex-wrap:wrap}.library-list{max-height:400px}main{padding:12px}}
</style></head><body><header><h1>커리큘럼 편집</h1><span class="spacer"></span><span id="status" role="status">로컬 초안</span><button id="preview">미리보기</button><button id="save">저장</button><a href="/">할 일 표 ↗</a></header>
<main><p class="intro">편집 흐름을 검토하는 로컬 프로토타입입니다. 이 브라우저에만 저장하며 YouTube 재생목록을 생성·변경하지 않습니다. 학습 재생은 기존 YouTube 화면을 사용합니다.</p><div class="meta"><div><label>커리큘럼 제목<input id="title" placeholder="예: 재즈 기타 코드멜로디 입문"></label><label>목표<textarea id="goal" placeholder="이 과정을 마치면 무엇을 할 수 있나요?"></textarea></label></div><div><label>대상 · 선수 지식<input id="audience" placeholder="예: 기본 코드를 잡을 수 있는 사람"></label><label>소개<textarea id="description" placeholder="학습 순서와 연습 방법을 간단히 소개하세요"></textarea></label></div></div>
<div class="cols"><section><h2>학습 순서</h2><div id="sections"></div><button id="add-section">＋ 단계 추가</button><p class="hint">영상 시청완료와 연습 완료는 별개입니다. 여기서는 운영자가 연습과 완료 기준을 작성합니다.</p></section><section class="library"><h2>내 영상에서 추가</h2><label>추가할 단계<select id="destination"></select></label><input id="query" aria-label="영상 검색" placeholder="태그·제목 검색, 예: bass"><p id="result-count" class="intro"></p><div class="library-list" id="library"></div></section></div></main>
<dialog id="preview-dialog"><div class="row"><h2>학습 순서 미리보기</h2><span class="spacer"></span><button id="close-preview">닫기</button></div><p class="intro">공유·게시 전의 로컬 미리보기입니다. 영상 제목을 누르면 원래 YouTube 페이지를 엽니다.</p><div id="preview-content"></div><button id="export">초안 JSON 내려받기</button></dialog>
<script src="/search-core.js"></script><script>
const KEY='extension4youtube.curriculum.prototype.v1';
const blankSection=()=>({id:crypto.randomUUID(),title:'',goal:'',exercise:'',criterion:'',videos:[]});
let draft={version:1,title:'',goal:'',audience:'',description:'',sections:[blankSection()]},videos=[],active='';
try{const value=JSON.parse(localStorage.getItem(KEY));if(value?.version===1&&Array.isArray(value.sections)&&value.sections.length&&value.sections.every(s=>Array.isArray(s.videos)))draft=value;}catch{}
active=draft.sections[0].id;
if(localStorage.getItem(KEY))document.querySelector('#status').textContent='저장한 로컬 초안 복원됨';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(draft));document.querySelector('#status').textContent='이 브라우저에 저장됨';document.querySelector('#status').className='saved';}catch{document.querySelector('#status').textContent='저장 실패 · 초안을 JSON으로 내려받으세요';}}
for(const key of ['title','goal','audience','description']){const input=document.getElementById(key);input.value=draft[key];input.oninput=()=>{draft[key]=input.value;save();};}
function destinations(){const el=document.querySelector('#destination');el.replaceChildren();for(const [i,s]of draft.sections.entries()){const option=document.createElement('option');option.value=s.id;option.textContent=(i+1)+'단계 · '+(s.title||'제목 없음');el.append(option);}el.value=active;}
function renderSections(){const box=document.querySelector('#sections');box.replaceChildren();for(const [index,s]of draft.sections.entries()){const card=document.createElement('div');card.className='section'+(s.id===active?' active':'');card.innerHTML=`<div class="row"><strong>${index+1}단계</strong><input aria-label="${index+1}단계 제목" data-field="title" value="${esc(s.title)}" placeholder="단계 이름"><button data-action="up" aria-label="${index+1}단계 위로" ${index===0?'disabled':''}>↑</button><button data-action="down" aria-label="${index+1}단계 아래로" ${index===draft.sections.length-1?'disabled':''}>↓</button><button data-action="remove" aria-label="${index+1}단계 삭제" ${s.videos.length||draft.sections.length===1?'disabled':''}>×</button></div><label>이번 단계 목표<input data-field="goal" value="${esc(s.goal)}" placeholder="이번 단계에서 익힐 내용"></label><div class="lessons"></div><div class="actions"><button data-action="select">여기에 영상 추가</button></div><label>연습<textarea data-field="exercise" placeholder="보고 난 뒤 직접 할 연습">${esc(s.exercise)}</textarea></label><label>완료 기준<input data-field="criterion" value="${esc(s.criterion)}" placeholder="스스로 확인할 수 있는 기준"></label>`;
for(const input of card.querySelectorAll('[data-field]'))input.oninput=()=>{s[input.dataset.field]=input.value;save();if(input.dataset.field==='title')destinations();};
const lessons=card.querySelector('.lessons');if(!s.videos.length)lessons.innerHTML='<div class="empty">오른쪽에서 이 단계에 넣을 영상을 선택하세요.</div>';
for(const [i,v]of s.videos.entries()){const row=document.createElement('div');row.className='lesson';row.innerHTML=`<span>${i+1}.</span><span class="name">${esc(v.title)}</span><button aria-label="영상 ${i+1} 위로" ${i===0?'disabled':''}>↑</button><button aria-label="영상 ${i+1} 아래로" ${i===s.videos.length-1?'disabled':''}>↓</button><button aria-label="영상 ${i+1} 목록에서 빼기">×</button>`;const [up,down,remove]=row.querySelectorAll('button');up.onclick=()=>{[s.videos[i-1],s.videos[i]]=[s.videos[i],s.videos[i-1]];changed();};down.onclick=()=>{[s.videos[i+1],s.videos[i]]=[s.videos[i],s.videos[i+1]];changed();};remove.onclick=()=>{s.videos.splice(i,1);changed();};lessons.append(row);}
card.querySelector('[data-action=select]').onclick=()=>{active=s.id;renderSections();renderLibrary();document.querySelector('#query').focus();};card.querySelector('[data-action=up]').onclick=()=>{[draft.sections[index-1],draft.sections[index]]=[draft.sections[index],draft.sections[index-1]];changed();};card.querySelector('[data-action=down]').onclick=()=>{[draft.sections[index+1],draft.sections[index]]=[draft.sections[index],draft.sections[index+1]];changed();};card.querySelector('[data-action=remove]').onclick=()=>{draft.sections.splice(index,1);if(active===s.id)active=draft.sections[0].id;changed();};box.append(card);}destinations();}
function changed(){save();renderSections();renderLibrary();}
function renderLibrary(){const query=document.querySelector('#query').value,found=videos.filter(v=>SearchCore.matches(v,query,'both'));document.querySelector('#result-count').textContent=found.length+'개 결과 · '+videos.length+'개 시험 자료';const box=document.querySelector('#library');box.replaceChildren();for(const v of found.slice(0,40)){const selected=draft.sections.find(s=>s.id===active),added=selected.videos.some(x=>x.id===v.id);const row=document.createElement('div');row.className='video';row.innerHTML=`<div class="name">${esc(v.title)}<div class="tag">${esc(v.tags.join(' · '))}</div></div><button ${added?'disabled':''}>${added?'추가됨':'＋'}</button>`;row.querySelector('button').onclick=()=>{selected.videos.push({id:v.id,title:v.title,url:v.url});changed();};box.append(row);}}
document.querySelector('#destination').onchange=e=>{active=e.target.value;renderSections();renderLibrary();};document.querySelector('#query').oninput=renderLibrary;document.querySelector('#add-section').onclick=()=>{const s=blankSection();draft.sections.push(s);active=s.id;changed();};document.querySelector('#save').onclick=save;
document.querySelector('#preview').onclick=()=>{const box=document.querySelector('#preview-content');box.innerHTML=`<h2>${esc(draft.title||'제목 없는 커리큘럼')}</h2><p>${esc(draft.goal)}</p><small>대상 · ${esc(draft.audience||'미작성')}</small><p>${esc(draft.description)}</p>`+draft.sections.map((s,i)=>`<section class="preview-section"><h3>${i+1}단계 · ${esc(s.title||'제목 없음')}</h3><p>목표 · ${esc(s.goal||'미작성')}</p><ol>${s.videos.map(v=>`<li><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}">${esc(v.title)}</a></li>`).join('')}</ol><p>연습 · ${esc(s.exercise||'미작성')}</p><p>완료 기준 · ${esc(s.criterion||'미작성')}</p></section>`).join('');document.querySelector('#preview-dialog').showModal();};document.querySelector('#close-preview').onclick=()=>document.querySelector('#preview-dialog').close();document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='curriculum-draft.json';a.click();URL.revokeObjectURL(a.href);};
renderSections();fetch('/prototype-videos.json').then(r=>{if(!r.ok)throw Error('자료 불러오기 실패');return r.json();}).then(data=>{videos=data;renderLibrary();}).catch(e=>document.querySelector('#result-count').textContent=e.message);
</script></body></html>
